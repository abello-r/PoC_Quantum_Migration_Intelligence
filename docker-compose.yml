services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${BACKEND_PORT:-3000}
      NODE_ENV: production
      SCAN_MAX_FILES: ${SCAN_MAX_FILES:-5000}
      SCAN_MAX_FILE_BYTES: ${SCAN_MAX_FILE_BYTES:-1000000}
      CRYPTOSCAN_BIN: ${CRYPTOSCAN_BIN:-cryptoscan}
      CRYPTOSCAN_TIMEOUT_MS: ${CRYPTOSCAN_TIMEOUT_MS:-180000}
      CRYPTOSCAN_DISABLE_FALLBACK: ${CRYPTOSCAN_DISABLE_FALLBACK:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
